<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ParaViz — Scientific Visualization Studio (WebGPU)</title>
  <link data-trunk rel="icon" href="../../assets/icon.png" />
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11151e;
      color: #dce3f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #loading_text {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #11151e;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(56, 189, 248, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading_text">
    <div class="spinner"></div>
    <div><strong>Loading ParaViz WebGPU Studio…</strong></div>
    <div style="font-size: 13px; color: #8e9bb2;">Requires a browser with WebGPU (or WebGL2) enabled.</div>
  </div>
  <canvas id="paraviz_canvas"></canvas>
</body>
</html>
