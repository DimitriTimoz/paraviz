<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ParaViz — Scientific Visualization Studio (WebGPU)</title>
  <meta name="description" content="Explore 3D meshes, CFD flows, finite-element grids, and volumetric scans directly in your browser. Built with Rust, WebAssembly, and WebGPU." />
  <meta name="theme-color" content="#0b1120" />
  <link rel="canonical" href="https://dimitritimoz.github.io/paraviz/" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ParaViz" />
  <meta property="og:title" content="ParaViz — Scientific Visualization Studio (WebGPU)" />
  <meta property="og:description" content="Fast scientific visualization studio inspired by ParaView — built with Rust and WebGPU. Supports VTK, XDMF, OpenFOAM, NIfTI, 37+ parallel filters, and R32Float volume raymarching." />
  <meta property="og:url" content="https://dimitritimoz.github.io/paraviz/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/DimitriTimoz/paraviz/main/assets/showcase.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ParaViz — Scientific Visualization Studio (WebGPU)" />
  <meta name="twitter:description" content="Explore 3D meshes, CFD flows, and medical/volumetric scans directly in your browser with Rust and WebGPU." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/DimitriTimoz/paraviz/main/assets/showcase.png" />

  <link data-trunk rel="icon" href="../../assets/icon.png" />
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #loading_text {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(640px 360px at 50% 42%, rgba(56, 189, 248, 0.14), transparent 70%),
        radial-gradient(480px 280px at 58% 58%, rgba(99, 102, 241, 0.12), transparent 70%),
        #0b1120;
      z-index: 10;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 440px;
      padding: 28px 32px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .splash-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }
    .splash-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.32);
    }
    .splash-sub {
      font-size: 14px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .splash-note {
      font-size: 12.5px;
      line-height: 1.45;
      color: #64748b;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      padding-top: 12px;
      margin-top: 2px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.22);
      border-top-color: #38bdf8;
      border-right-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading_text">
    <div class="splash-card">
      <div class="spinner" aria-hidden="true"></div>
      <div class="splash-title">
        <span>ParaViz Studio</span>
        <span class="splash-badge">WebGPU</span>
      </div>
      <div class="splash-sub">Initializing WebAssembly &amp; GPU visualization pipeline…</div>
      <div class="splash-note">
        Requires a browser with <strong>WebGPU</strong> (Chrome / Edge 113+, Safari 18+) or <strong>WebGL2</strong> enabled.
      </div>
    </div>
    <noscript>
      <div class="splash-sub">JavaScript and WebAssembly are required to run ParaViz Studio in the browser.</div>
    </noscript>
  </div>
  <canvas id="paraviz_canvas"></canvas>
</body>
</html>
