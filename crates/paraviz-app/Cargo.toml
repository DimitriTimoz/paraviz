[package]
name = "paraviz-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/paraviz-app"
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Interactive ParaView-style WebGPU desktop application and headless CLI renderer for ParaViz"

[dependencies]
paraviz = { path = "../..", version = "0.2.5" }
paraviz-core.workspace = true
paraviz-sources.workspace = true
paraviz-filters.workspace = true
paraviz-io.workspace = true
paraviz-render.workspace = true
glam.workspace = true
wgpu.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
env_logger.workspace = true
log.workspace = true
png.workspace = true
rfd.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }

[[bin]]
name = "paraviz"
path = "src/main.rs"
