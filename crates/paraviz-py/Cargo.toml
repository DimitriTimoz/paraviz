[workspace]

[package]
name = "paraviz-py"
version = "0.2.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Python bindings for ParaViz (Rust + WebGPU scientific visualization). Ships a paraview.simple-compatible API via the bundled `paraview` package."

[lib]
name = "_paraviz"
crate-type = ["cdylib"]

[dependencies]
paraviz = { path = "../.." }
pyo3 = { version = "0.30", features = ["extension-module"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
