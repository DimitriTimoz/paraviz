<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="ParaViz Architecture Flow: I/O and Sources, PipelineGraph, WebGPU Renderer, and Multi-Target Outputs">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="boxFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="18" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="28" y="34" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.06em">PARAVIZ DEMAND-DRIVEN PIPELINE &amp; WEBGPU ARCHITECTURE</text>

  <!-- Stage 1: Sources & I/O -->
  <g transform="translate(26, 54)">
    <rect x="0" y="0" width="202" height="140" rx="12" fill="url(#boxFill)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="202" height="30" rx="12" fill="#0f2942"/>
    <rect x="0" y="18" width="202" height="12" fill="#0f2942"/>
    <text x="14" y="20" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Sources &amp; I/O</text>
    <text x="14" y="50" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">paraviz-io · -sources</text>
    <text x="14" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 14 Procedural Sources</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• VTK / XML / .pvd Series</text>
    <text x="14" y="108" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• XDMF+HDF5, OpenFOAM</text>
    <text x="14" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• NIfTI, NRRD, MHA, STL</text>
  </g>

  <line x1="232" y1="124" x2="258" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Stage 2: PipelineGraph & Filters -->
  <g transform="translate(262, 54)">
    <rect x="0" y="0" width="202" height="140" rx="12" fill="url(#boxFill)" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="202" height="30" rx="12" fill="#1e1b4b"/>
    <rect x="0" y="18" width="202" height="12" fill="#1e1b4b"/>
    <text x="14" y="20" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. PipelineGraph DAG</text>
    <text x="14" y="50" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">paraviz-core · -filters</text>
    <text x="14" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Pull Evaluation &amp; Cache</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 37+ Rayon Filters</text>
    <text x="14" y="108" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Contour, Slice, Clip, QEM</text>
    <text x="14" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• StreamTracer, Calculator</text>
  </g>

  <line x1="468" y1="124" x2="494" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Stage 3: WebGPU Render Engine -->
  <g transform="translate(498, 54)">
    <rect x="0" y="0" width="202" height="140" rx="12" fill="url(#boxFill)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="202" height="30" rx="12" fill="#113242"/>
    <rect x="0" y="18" width="202" height="12" fill="#113242"/>
    <text x="14" y="20" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. WebGPU Engine</text>
    <text x="14" y="50" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">paraviz-render (wgpu)</text>
    <text x="14" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Barycentric Edge Shader</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• R32Float Volume Raymarch</text>
    <text x="14" y="108" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 4x MSAA + EDL + Gizmo</text>
    <text x="14" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• GPU Compute Contour</text>
  </g>

  <line x1="704" y1="124" x2="730" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Stage 4: Apps & Exports -->
  <g transform="translate(734, 54)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="url(#boxFill)" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="30" rx="12" fill="#2e1a1f"/>
    <rect x="0" y="18" width="200" height="12" fill="#2e1a1f"/>
    <text x="14" y="20" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">4. Targets &amp; Exports</text>
    <text x="14" y="50" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">paraviz · -app · -py</text>
    <text x="14" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Native Desktop &amp; Wasm</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Headless Batch CLI</text>
    <text x="14" y="108" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Rust Trace &amp; JSON State</text>
    <text x="14" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• PNG, GIF, .glb, .html</text>
  </g>
</svg>
