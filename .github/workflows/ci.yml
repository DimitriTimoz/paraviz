name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-lint-docs:
    name: Check, Clippy & Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics/windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: Build rustdoc
        run: cargo doc --workspace --exclude paraviz-app --no-deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Vulkan & windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace test suite
        run: cargo test --workspace

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-audit

      - name: Audit workspace dependencies
        run: cargo audit

      - name: Audit Python binding dependencies
        run: cargo audit --file crates/paraviz-py/Cargo.lock

  packaging-check:
    name: Packaging Check (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate build-appimage.sh syntax and appimagetool checksums
        run: |
          bash -n packaging/linux/build-appimage.sh
          version="$(sed -n 's/^APPIMAGETOOL_VERSION="\([^"]*\)"/\1/p' packaging/linux/build-appimage.sh)"
          test -n "${version}"
          for arch in x86_64 aarch64; do
            expected="$(awk -v arch="${arch}" '
              $0 ~ "^  " arch "\\)" { found=1; next }
              found && /APPIMAGETOOL_SHA256=/ {
                gsub(/.*APPIMAGETOOL_SHA256="|".*/, "");
                print;
                exit;
              }
            ' packaging/linux/build-appimage.sh)"
            test -n "${expected}"
            url="https://github.com/AppImage/appimagetool/releases/download/${version}/appimagetool-${arch}.AppImage"
            actual="$(curl -sfL "${url}" | sha256sum | awk '{print $1}')"
            if [ "${actual}" != "${expected}" ]; then
              echo "Checksum mismatch for ${arch} (${version}): expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          done
