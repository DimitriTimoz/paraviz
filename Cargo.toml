[workspace]
members = [
    ".",
    "crates/paraviz-core",
    "crates/paraviz-sources",
    "crates/paraviz-filters",
    "crates/paraviz-io",
    "crates/paraviz-render",
    "crates/paraviz-app",
]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ParaViz Contributors"]
description = "ParaView rewritten in Rust using WebGPU (wgpu) for scientific visualization"
repository = "https://github.com/DimitriTimoz/paraviz"
homepage = "https://dimitritimoz.github.io/paraviz/"
documentation = "https://docs.rs/paraviz"
keywords = ["visualization", "paraview", "vtk", "wgpu", "scientific"]
categories = ["visualization", "science", "graphics", "rendering"]
readme = "README.md"

[workspace.dependencies]
paraviz-core = { path = "crates/paraviz-core", version = "0.2.5" }
paraviz-sources = { path = "crates/paraviz-sources", version = "0.2.5" }
paraviz-filters = { path = "crates/paraviz-filters", version = "0.2.5" }
paraviz-io = { path = "crates/paraviz-io", version = "0.2.5" }
paraviz-render = { path = "crates/paraviz-render", version = "0.2.5" }

glam = { version = "0.34", features = ["serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30.0"
pollster = "1.0"
rayon = "1.12"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18"
quick-xml = "0.42"
base64 = "0.23"
flate2 = "1.1"
lz4_flex = "0.11"
lzma-rs = "0.3"
rustc-hash = "2.1"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui = "0.37"
egui-wgpu = "0.37"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
web-time = "1.1"

[package]
name = "paraviz"
version = "0.2.6"
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude = [
    ".github/",
    "assets/",
    "crates/",
    "docs/",
    "packaging/",
    "AGENT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "*.png",
    "*.gif",
    "*.glb",
]

[dependencies]
paraviz-core.workspace = true
paraviz-sources.workspace = true
paraviz-filters.workspace = true
paraviz-io.workspace = true
paraviz-render.workspace = true
glam.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
